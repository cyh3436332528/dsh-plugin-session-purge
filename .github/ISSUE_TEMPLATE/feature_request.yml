name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法。请先读一遍下面两条硬约束——如果提案与它们冲突，大概率不会被接受。

        > 1. 本插件的语义是**真删**（删文件），不是归档。任何把「隐藏」混进来的提案都会被拒。
        > 2. 任何**降低删除确认门槛**、让删除更「顺手」的提案都会被拒。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 与 README 的「已知限制」，确认这是新建议
          required: true
        - label: 我已经读过上方的两条硬约束，我的提案不与之冲突
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的是什么问题？
      description: 不要直接跳到方案——先说清楚你被什么卡住了
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做？
      description: 如果能说明它在界面上应该长什么样、怎么交互，会帮助很大
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 例如用 DSH 自带功能、用别的插件、或者干脆不改
    validations:
      required: false

  - type: textarea
    id: risk
    attributes:
      label: 风险与影响
      description: |
        这个改动会不会影响删除范围？会不会让误删更容易发生？
        会不会增加对 DSH 内部实现的依赖？
    validations:
      required: true
